name: Publish Action
run-name: "Publish Action #${{ github.run_number }} - ${{ github.event.head_commit.message }}"

on:
  push:
    branches:
      - main

jobs:
  validate-workflow:
    uses: ./.github/workflows/validate-workflow.yml
  publish-action:
    needs: validate-workflow
    runs-on: ubuntu-latest
    name: Publish action
    steps:
      - uses: mapfre-tech/action-publish@v1
        with:
          app-semantic-release-id: ${{ secrets.APP_SEMANTIC_RELEASE_ID }}
          app-semantic-release-private-key: ${{ secrets.APP_SEMANTIC_RELEASE_PRIVATE_KEY }}
