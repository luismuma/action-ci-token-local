name: Auto-Doc
run-name: "Auto-Doc"

on:
  push:
    branches:
      - 'develop'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-doc:
    runs-on: ubuntu-latest
    steps:
      - name: Generate token
        id: generate_token
        uses: tibdex/github-app-token@v2.1.0
        with:
          app_id: ${{ secrets.APP_SEMANTIC_RELEASE_ID }}
          private_key: ${{ secrets.APP_SEMANTIC_RELEASE_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.generate_token.outputs.token }}

      - name: Run Autodoc Action
        uses: mapfre-tech/action-autodoc@v1
        with:
          github_token: ${{ steps.generate_token.outputs.token }}
          action_array: "[.github/workflows/get-token.yml, decrypt/action.yml, revoke/action.yml]"


